# Пример настроек: скопируйте в config.toml и правьте под себя.
# Все значения перекрываются флагами командной строки.

[general]
output_dir = "output"      # куда складывать результаты (по одной папке на VOD)
limit_seconds = 0          # 0 = анализировать весь стрим; N = только первые N секунд (тесты)
# mode = "toparachevt"     # мод оформления: оглавление "2:04:19 - Любимый цвет" (default — как раньше)

[chat]
chat_stride = 45.0         # шаг сканирования чата в «тихих» местах, сек
chat_delay = 0.2           # пауза между запросами к Twitch GQL, сек (не долбите API)
chat_gap_audit = true      # проверять и добирать пропуски после основного прохода

[asr]
whisper_model = "medium"   # tiny | base | small | medium | large-v3
whisper_device = "auto"    # auto | cuda | cpu
whisper_compute_type = "auto"
whisper_beam_size = 5
whisper_vad = true
whisper_batch_size = 8    # 1 = без батчей; >1 — пакетное декодирование (быстрее на длинных стримах)
language = "ru"            # "ru" — русский стрим по умолчанию; "auto"/"" — автоопределение
translate_to = ""          # например "ru" — перевести расшифровку через LLM

[llm]
llm_provider = "auto"      # auto | none | ollama | openai
llm_model = "qwen2.5:7b-instruct"
llm_base_url = ""          # http://127.0.0.1:11434 или https://api.openai.com/v1
# llm_api_key = ""         # лучше задать через переменную окружения OPENAI_API_KEY
llm_max_candidates = 32    # сколько кандидатов отдавать модели
llm_batch = 8

[detect]
bucket = 5.0               # окно агрегации сигналов, сек
top_candidates = 40         # сколько кандидатов брать до отбора
min_gap = 45.0              # минимальное расстояние между клипами, сек
max_clips = 15              # потолок клипов
min_moments = 0             # гарантированно выдать не меньше N (0 = не добивать)
clip_length = 40.0          # целевая длина клипа
clip_padding = 6.0          # запас до/после события, сек
min_clip_length = 12.0      # минимальная длина клипа, сек
max_clip_length = 120.0     # максимальная длина клипа, сек

# Пресеты (перекрываются флагом --preset):
#   sparse — 15 сильнейших моментов (дефолт выше)
#   dense  — ~1 клип в минуту стрима: min_moments=100, min_gap=12, min_clip_length=10
#   full   — максимально подробно: min_moments=300, min_gap=5, min_clip_length=8
#
# Сколько моментов физически влезает: длительность / (min_clip_length + min_gap)
#   10 мин  при gap=12/клип=10с -> ~27      1 ч   -> ~163      3.4 ч -> ~562
#   10 мин  при gap=5 /клип=8с  -> ~46      1 ч   -> ~276      3.4 ч -> ~951

[cut]
quality = "1080p60"        # best | 1080p60 | 1080p | 720p60 | 720p | 480p | 360p | audio
vertical = false           # делать версии 9:16 (Shorts/TikTok)
burn_subs = false          # вжигать субтитры в клипы
precise_cut = false        # точная резка по кадрам (медленнее, но ровнее)
cut_workers = 2
thumbnail = true
